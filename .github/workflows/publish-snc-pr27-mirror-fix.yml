name: Publish SNC PR 27 Mirror-Fix Preview

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish exact committed candidate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="e765de889febb7e3daf6184fa00e3df1e7a575ea"
          SHORT_SHA="e765de889feb"
          TARGET="snc/pr-27/${SHORT_SHA}"
          EXPECTED_BYTES="1927802"
          EXPECTED_SHA="f863f10d09525b24bd6bbaf38febcbc2e736e44d6e55c7fb8dcef9c03a6825ea"
          mkdir -p "$TARGET"
          curl -fsSL "https://raw.githubusercontent.com/falloutmule/solidarity-not-charity-can-run/${SOURCE_SHA}/index.html" -o "$TARGET/index.html"
          ACTUAL_BYTES="$(wc -c < "$TARGET/index.html" | tr -d ' ')"
          ACTUAL_SHA="$(sha256sum "$TARGET/index.html" | awk '{print $1}')"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          cat > "$TARGET/preview.json" <<JSON
          {
            "schema": "snc-immutable-review-preview-v1",
            "repository": "falloutmule/solidarity-not-charity-can-run",
            "pullRequest": 27,
            "candidateCommit": "${SOURCE_SHA}",
            "buildId": "runtimegallery4",
            "repair": "single directional dumpster plane; adjacent footprint faces transparent",
            "artifact": {
              "path": "index.html",
              "byteLength": ${ACTUAL_BYTES},
              "sha256": "${ACTUAL_SHA}"
            },
            "scope": "review-only; not production Pages"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET/index.html" "$TARGET/preview.json"
          git commit -m "Publish SNC PR 27 close-range mirror fix preview"
          git push origin HEAD:main

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          URL="https://falloutmule.github.io/sfhs-preview/snc/pr-27/e765de889feb/preview.json"
          for attempt in $(seq 1 60); do
            if curl -fsSL "$URL" | grep -q 'e765de889febb7e3daf6184fa00e3df1e7a575ea'; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become available in time." >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/snc-preview-capture
          cd /tmp/snc-preview-capture
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Verify and capture mobile preview
        shell: bash
        env:
          NODE_PATH: /tmp/snc-preview-capture/node_modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const target = 'snc/pr-27/e765de889feb';
          const base = 'https://falloutmule.github.io/sfhs-preview/' + target + '/index.html';
          const result = {
            schema: 'snc-preview-verification-v1',
            sourceCommit: 'e765de889febb7e3daf6184fa00e3df1e7a575ea',
            buildId: 'runtimegallery4',
            viewport: { width:390, height:844, touch:true },
            http: {}, gallery: {}, dumpster: {}, proof: {},
            pageErrors: [], consoleErrors: [], externalRequests: []
          };
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({ viewport:{width:390,height:844}, isMobile:true, hasTouch:true, deviceScaleFactor:1 });
            const origin = new URL(base).origin;
            const wire = (page, label) => {
              page.on('pageerror', error => result.pageErrors.push(label + ': ' + String(error.stack || error)));
              page.on('console', message => { if(message.type() === 'error') result.consoleErrors.push(label + ': ' + message.text()); });
              page.on('request', request => {
                if(/^https?:/i.test(request.url()) && new URL(request.url()).origin !== origin) result.externalRequests.push(label + ': ' + request.url());
              });
            };

            const gallery = await context.newPage();
            wire(gallery, 'gallery');
            let response = await gallery.goto(base + '?assetgallery=1', { waitUntil:'load', timeout:20000 });
            result.http.assetGallery = response && response.status();
            await gallery.waitForFunction(() => {
              const state = window.SNCDiagnostics.getSnapshot().runtime.assetGallery;
              return state && state.active && state.exhibitCount === 22;
            }, null, { timeout:15000 });
            result.gallery = await gallery.evaluate(() => window.SNCDiagnostics.getSnapshot().runtime.assetGallery);
            result.gallery.screenshot = 'asset-gallery-mobile.png';
            await gallery.screenshot({ path:target + '/asset-gallery-mobile.png', fullPage:true });
            await gallery.close();

            const dumpster = await context.newPage();
            wire(dumpster, 'dumpster');
            response = await dumpster.goto(base, { waitUntil:'load', timeout:20000 });
            result.http.dumpsterPilot = response && response.status();
            await dumpster.waitForFunction(() => {
              const asset = window.BITMAP_BUILDING_ASSET_REGISTRY && window.BITMAP_BUILDING_ASSET_REGISTRY.dumpster_001;
              return asset && asset.loadState && asset.loadState.status === 'loaded';
            }, null, { timeout:15000 });
            await dumpster.locator('[data-action="custom-level-dumpster_pilot"]').click();
            await dumpster.waitForFunction(() => window.SNCDiagnostics.getSnapshot().runtime.state === 'play', null, { timeout:15000 });
            await dumpster.evaluate(() => {
              player.x = 2.55;
              player.y = 5.45;
              player.angle = Math.atan2(4 - player.y, 3.5 - player.x);
              if(typeof crResetRenderPoseHistory === 'function') crResetRenderPoseHistory('preview-close-corner');
              else if(typeof crResetRenderAngleHistory === 'function') crResetRenderAngleHistory('preview-close-corner');
            });
            await dumpster.waitForFunction(() => {
              const diagnostics = crGetSinglePlaneCutoutDiagnostics();
              return diagnostics && diagnostics.active && diagnostics.lookupCount > 0 &&
                diagnostics.selectedWorldFace === 'west' && diagnostics.selectedLocalFace === 'west';
            }, null, { timeout:15000 });
            await dumpster.evaluate(() => new Promise(resolve => {
              let frames = 0;
              function next(){ if(++frames >= 12) resolve(); else requestAnimationFrame(next); }
              requestAnimationFrame(next);
            }));
            result.dumpster = await dumpster.evaluate(() => {
              const placement = game.buildingRegistry[1];
              const cell = game.buildingGrid[4][3];
              const west = resolveWholeFaceBitmapBuildingColumn({ side:0, stepX:1, stepY:-1, cell, wallFraction:0.5 }, placement);
              const south = resolveWholeFaceBitmapBuildingColumn({ side:1, stepX:1, stepY:-1, cell, wallFraction:0.5 }, placement);
              return {
                customLevel: window.SNCDiagnostics.getSnapshot().runtime.customLevel,
                diagnostics: crGetSinglePlaneCutoutDiagnostics(),
                westOpaqueRuns: west && Array.isArray(west.opaqueRuns) ? west.opaqueRuns.length : null,
                southOpaqueRuns: south && Array.isArray(south.opaqueRuns) ? south.opaqueRuns.length : null,
                southFaceSize: south && south.face ? { width:south.face.width, height:south.face.height } : null,
                screenshot: 'dumpster-close-corner-mobile.png'
              };
            });
            if(!(result.dumpster.westOpaqueRuns > 0)) throw new Error('selected west face lost dumpster pixels');
            if(result.dumpster.southOpaqueRuns !== 0) throw new Error('adjacent south face still contains dumpster pixels');
            await dumpster.screenshot({ path:target + '/dumpster-close-corner-mobile.png', fullPage:true });
            await dumpster.close();

            const proof = await context.newPage();
            wire(proof, 'proof');
            response = await proof.goto(base + '?cutoutproof=1&cutoutview=front&cutoutrotation=0', { waitUntil:'load', timeout:20000 });
            result.http.proof = response && response.status();
            await proof.locator('[data-action="custom-level-dumpster_pilot"]').click();
            await proof.waitForFunction(() => {
              const value = window.SNCDiagnostics.getSnapshot().alphaCutout;
              return value && value.enabled && value.opaquePixels > 0 && value.transparentPixels > 0;
            }, null, { timeout:15000 });
            result.proof = await proof.evaluate(() => window.SNCDiagnostics.getSnapshot().alphaCutout);
            await proof.close();

            await context.close();
            await browser.close();
            if(result.pageErrors.length || result.consoleErrors.length || result.externalRequests.length){
              throw new Error(JSON.stringify({ pageErrors:result.pageErrors, consoleErrors:result.consoleErrors, externalRequests:result.externalRequests }));
            }
            fs.writeFileSync(target + '/verification.json', JSON.stringify(result, null, 2) + '\n');
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Commit mobile evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snc/pr-27/e765de889feb/asset-gallery-mobile.png \
                  snc/pr-27/e765de889feb/dumpster-close-corner-mobile.png \
                  snc/pr-27/e765de889feb/verification.json
          git commit -m "Add SNC PR 27 mirror-fix mobile evidence"
          git push origin HEAD:main
